<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaGa CaGa | Autonomous Life-Stage Simulator</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<aside id="sidebar" aria-label="Sidebar">
  <nav class="feature-rail" aria-label="Features">
    <button data-page="home" aria-label="Home" title="Home"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></svg></button>
    <button data-page="demo" aria-label="Demo account" title="Demo account"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="8" cy="10" r="1.5"/><path d="m3 17 5-4 3 2 4-4 6 5"/></svg></button>
    <button data-page="sim" aria-label="Simulator" title="Simulator"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button data-page="learn" aria-label="Learning" title="Learning"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1zm0 0v14"/></svg></button>
    <button data-action="coach" aria-label="Simulation Coach" title="Simulation Coach"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10z"/></svg></button>
  </nav>
  <section id="chat-panel" class="chat-panel" aria-label="Chats">
    <button class="brand" data-page="home">CaGa CaGa</button>
    <button class="new" data-action="new"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6M17 3l4 4-9 9-5 1 1-5z"/></svg> New Chat</button>
    <section class="sidebar-history" aria-labelledby="sidebar-history-title">
      <h2 id="sidebar-history-title">History</h2>
      <div id="sidebar-history"></div>
    </section>
    <div class="agent"><span class="dot" aria-hidden="true"></span> Simulation Coach available</div>
  </section>
</aside>
<div class="workspace">
<header><div class="header-start"><button id="menu" aria-label="Hide chat sidebar" title="Hide chat sidebar" aria-controls="chat-panel" aria-expanded="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><span id="location">Home</span></div><span class="badge">◈ Educational simulation</span></header>
<main id="main" tabindex="-1"></main>
</div>
<dialog id="coach-dialog" aria-labelledby="coach-title">
  <div class="row"><h2 id="coach-title">Simulation Coach</h2><button data-action="close-coach">Close</button></div>
  <p>Ask about the current scenario or a learning topic. Replies are scripted for this local demo.</p>
  <div id="coach-log" class="log" role="log" aria-label="Coach replies"></div>
  <form id="coach-form" class="composer"><label class="sr" for="coach-question">Ask the coach</label><input id="coach-question" name="question" required maxlength="500" placeholder="Ask about this scenario…"><button class="primary">Send</button></form>
</dialog>
</body>
</html>
