<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaGa CaGa | Student Investment Lab</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./model.js"></script>
  <script defer src="./app.js"></script>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside id="sidebar" aria-label="Workspace navigation">
    <nav class="feature-rail" aria-label="Main navigation">
      <button class="rail-button rail-home" data-page="home" aria-label="Home" title="Home">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5v8.7a1.8 1.8 0 0 1-1.8 1.8H15v-6H9v6H4.8A1.8 1.8 0 0 1 3 19.2z"/></svg>
      </button>
      <div class="rail-rule"></div>
      <button class="rail-button" data-page="academy" aria-label="Learning Academy" title="Learning Academy"><img src="./images/academy.svg" width="34" height="34" alt=""></button>
      <button class="rail-button" data-page="market" aria-label="Market &amp; Simulator" title="Market &amp; Simulator"><img src="./images/market.svg" width="34" height="34" alt=""></button>
      <button class="rail-button" data-page="mentor" aria-label="AI Investment Mentor" title="AI Investment Mentor"><img src="./images/mentor.svg" width="34" height="34" alt=""></button>
      <button class="rail-button" data-page="missions" aria-label="Missions &amp; Challenges" title="Missions &amp; Challenges"><img src="./images/missions.svg" width="34" height="34" alt=""></button>
      <button class="rail-button" data-page="news" aria-label="News &amp; Sentiment Lab" title="News &amp; Sentiment Lab"><img src="./images/news.svg" width="34" height="34" alt=""></button>
      <button class="rail-button rail-profile" data-page="profile" aria-label="Demo profile" title="Demo profile"><span class="avatar" aria-hidden="true">ST</span></button>
    </nav>
    <section id="feature-panel" class="feature-panel" aria-labelledby="feature-title">
      <div class="panel-heading">
        <div>
          <p class="panel-kicker">CaGa CaGa workspace</p>
          <h2 id="feature-title">Home</h2>
        </div>
        <button id="close-panel" class="icon-button panel-close" aria-label="Close sidebar" title="Close sidebar">×</button>
      </div>
      <div id="panel-content"></div>
      <div class="panel-foot"><span class="dot" aria-hidden="true"></span> Student demo</div>
    </section>
  </aside>
  <button id="backdrop" class="backdrop" aria-label="Close sidebar" tabindex="-1" hidden></button>
  <div class="workspace">
    <header class="toolbar">
      <div class="toolbar-start">
        <button id="menu" class="icon-button" aria-label="Hide sidebar" title="Hide sidebar" aria-controls="feature-panel" aria-expanded="true">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <span class="toolbar-brand">CaGa CaGa</span>
        <span class="toolbar-divider" aria-hidden="true">/</span>
        <span id="location">Home</span>
      </div>
      <button class="profile-button" data-page="profile" aria-label="Open student demo profile"><span class="demo-pill"><span class="dot"></span> Demo workspace</span><span class="avatar" aria-hidden="true">ST</span></button>
    </header>
    <p id="storage-status" class="storage-status" role="status" hidden></p>
    <main id="main" tabindex="-1">
      <section class="card">
        <h1>CaGa CaGa</h1>
        <p>If this message stays on screen, check that JavaScript is enabled and that app.js and model.js are in the same folder as index.html.</p>
      </section>
    </main>
  </div>
  <div id="announcer" class="sr" role="status"></div>
</body>
</html>
