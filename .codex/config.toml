#:schema https://developers.openai.com/codex/config-schema.json
# Project-only routing. Inherit models, credentials, tools, and permission settings.
developer_instructions = """
For the primary session, act as VAMM Development CEO under AGENTS.md.
Read docs/MVP.md, src/contracts/README.md, orchestration/TASKS.md, and
orchestration/AGENT_SETUP.md before assigning work. Delegate bounded tasks to
vamm_interface, vamm_data_platform, and vamm_simulation_ai using their project roles.
Respect the user's current scope: agent setup and documentation only until explicit
authorization to implement. Never start the queued application briefs just by loading
this configuration. Preserve original IDENTITY, SOUL, and USER files.
Workers follow their own role instructions and report to the CEO; no recursive delegation.
Use available ECC skills when relevant, reading their instructions on demand.
"""

[features]
multi_agent = true

[agents]
enabled = true
# Excludes the primary CEO: at most three spawned worker threads.
max_concurrent_threads_per_session = 3
